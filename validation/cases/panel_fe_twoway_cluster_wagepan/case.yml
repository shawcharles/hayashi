id: panel_fe_twoway_cluster_wagepan
title: Panel fixed-effects wage equation with two-way clustered SEs on Wooldridge wagepan
estimator_family: panel_fe
status: blocked
dimension: numerical

dataset:
  name: wooldridge::wagepan
  source: R package wooldridge / Python wooldridge package
  licence: public teaching dataset

references:
  - R
  - Python

comparison:
  quantities:
    - coefficients
    - standard_errors
  tolerances:
    coefficients: 1e-4
    standard_errors: 1e-4

output_format: txt

hayashi_script: cases/panel_fe_twoway_cluster_wagepan/hayashi/run.hay
reference_scripts:
  R: cases/panel_fe_twoway_cluster_wagepan/reference/run.R
  Python: cases/panel_fe_twoway_cluster_wagepan/reference/run.py

notes: Two-way clustered covariance is materially indefinite on this dataset, so fitted inference is unavailable. References expose raw covariance without diagonal clipping; the interpreter rejection is covered by a Rust regression.

result:
  summary: "Inference unavailable: raw two-way covariance has negative variance and four negative eigenvalues. Do not interpret clipped zero standard errors as numerical agreement."
  known_differences: []
  issues_opened: []
